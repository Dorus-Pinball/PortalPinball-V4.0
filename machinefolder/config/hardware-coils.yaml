#config_version=6

# Hardware Configuration: Coils

coils:
  # Chain PSOC 2-0-x
  # c-sling-right/c-sling-left moved to the Cobra chain 0 board (0x20), Bank A, 2026-09-13 - see
  # below. 2-0-0/2-0-1 now free again.
  # c-plunger/c-trough-eject moved to the Cobra chain 0 board (0x20), Bank A - see below.
  # 2-0-2/2-0-3 now free again.

  c-popbumper-1:
    number: 2-0-4
    default_pulse_ms: 17
  c-popbumper-2:
    number: 2-0-5
    default_pulse_ms: 17
  c-popbumper-3:
    number: 2-0-6
    default_pulse_ms: 17
  c-drop:
    number: 2-0-7
    default_pulse_ms: 25

    # Cobra chain 0 (board 0x20) - flipper coils
    # Flipper coils, single main_coil per side, no hold_coil/eos_switch since the EOS is
    # mechanical/self-contained inside the coil assembly and not wired back to the controller.
    #
    # Board assignment moved from the PSOC chain (2-1-x) to the Cobra board (chain 0) per user
    # decision - flippers are timing-critical, and CobraPin's own docs (docs.missionpinball.org/
    # hardware/opp/cobrapin) say timing-critical devices should have their switch+coil on the
    # same STM32 board for a hardware autofire rule with minimal latency. 0-0-8/0-0-9 are the
    # actual pins used for real physical wiring (2026-09-06), both in Bank A (HV_A, brown wire per
    # docs/opp-hardware-reference.md) - supersedes the earlier 0-0-2/0-0-3 guess read off board
    # Overviews.xlsx's pin dump (now free again). Continuity/coil-driver check PASSED via
    # tools/wiring_test.py, and confirmed live in a real game - see TODO.md and
    # design/physical-checklists/wiring-guide.html.
    #
    # CORRECTION to the roadmap's original assumption: MPF's flipper device still requires a
    # nonzero default_hold_power even with no hold_coil/eos_switch - confirmed by reading
    # mpf/devices/flipper.py directly, it asserts "Cannot enable driver with hold_power 0.0"
    # and always builds a pulse+hold hardware rule (_enable_single_coil_rule) for this shape of
    # config. default_hold_power: 1.0 (full, unreduced) is the right value here specifically
    # because this hardware's hold winding is driven by the SAME activation signal as the power
    # winding (per the roadmap's own EOS research) - there's no separate PWM-reduced hold
    # winding for the controller to under-power, so a reduced hold_power would be wrong, not
    # just unnecessary.
  c-flipper-left:
    number: 0-0-8
    default_pulse_ms: 25
    default_hold_power: 1.0
  c-flipper-right:
    number: 0-0-9
    default_pulse_ms: 25
    default_hold_power: 1.0

  # c-plunger/c-trough-eject moved here from the PSOC chain (were 2-0-2/2-0-3) during the
  # 2026-09-12 session, onto the same Cobra chain 0 board's Bank A (HV_A, brown) as the flippers.
  # Both are a ball_device's own software/event-triggered eject coil, not a hardware-autofire
  # pair with any switch, so no same-board switch requirement applies here.
  c-plunger:
    number: 0-0-10
    default_pulse_ms: 21
  c-trough-eject:
    number: 0-0-11
    default_pulse_ms: 25

  # c-sling-left/c-sling-right moved here from the PSOC red board (were 2-0-1/2-0-0), 2026-09-13,
  # same migration pattern as c-plunger/c-trough-eject above. Both Bank A (HV_A, brown), same bank
  # as the flippers/plunger/trough-eject coils already on this board. Numbers swapped 2026-09-13
  # after the real-50V motion check found 0-0-0 actually drives the right sling and 0-0-12 the
  # left, not as originally assigned.
  c-sling-left:
    number: 0-0-12
    default_pulse_ms: 16
  c-sling-right:
    number: 0-0-0
    default_pulse_ms: 15

  # New ball-saver post coil, 2026-09-13. A short pulse (no hold power) kicks the post between
  # its two positions - position is read back via s-ball-saver in hardware-switches.yaml, not
  # tracked by this coil. Bank A (HV_A, brown). Real-50V motion tuning 2026-09-13: 25ms (initial
  # estimate) looked too long, 15ms and 20ms were both too weak - 40ms is the pulse that actually
  # throws the mechanism cleanly, confirmed by the user. Needs considerably more than this
  # board's other short-pulse coils (15-25ms) - KNOWN ROOT CAUSE per the user: the small spring
  # holding the mechanism pressed against its pin (the pin connects to the plunger) is too weak,
  # leaving too much play/deflection in the mechanism before the coil's pull actually translates
  # into post motion. If this coil ever needs re-tuning again or starts under-throwing, check
  # that spring/pin play first before assuming the pulse length regressed.
  c-ball-saver:
    number: 0-0-13
    default_pulse_ms: 40

    # DRAFT right ramp diverter coil (CAD-confirmed real hardware - Diverter_Rod/Diverter_Base/
    # Bridge_Diverter_Cover feeding a Subway tunnel, see
    # design/research/onshape-cad-findings.md). NOT confirmed against board Overviews.xlsx or a
    # physical continuity check yet, same status as the flipper coils above. `type: hold` (not
    # pulse) since a diverter physically holds a gate open/closed rather than firing a one-shot
    # kick - matches MPF's diverters: default `type: hold`. No game logic wired to it yet
    # (activate_events/deactivate_events) - what a diverted shot should actually do is a real
    # design question flagged in design/features/ramps.yaml, not answered by this hardware draft.
    # default_hold_power: 1.0 needed for the same reason as the flipper coils above - MPF asserts
    # "Cannot enable driver with hold_power 0.0" for any hold-type driver, confirmed the hard way
    # here too (ball search tried to pulse this coil and crashed the test event loop without it).
  c-ramp-diverter:
    number: 2-1-2
    default_hold_power: 1.0
