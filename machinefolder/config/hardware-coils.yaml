#config_version=6

# Hardware Configuration: Coils

coils:
  # Chain PSOC 2-0-x
  c-sling-right:
    number: 2-0-0
    default_pulse_ms: 15
  c-sling-left:
    number: 2-0-1
    default_pulse_ms: 16
  c-plunger:
    number: 2-0-2
    default_pulse_ms: 21
  c-trough-eject:
    number: 2-0-3
    default_pulse_ms: 25

  c-popbumper-1:
    number: 2-0-4
    default_pulse_ms: 17
  c-popbumper-2:
    number: 2-0-5
    default_pulse_ms: 17
  c-popbumper-3:
    number: 2-0-6
    default_pulse_ms: 17
  c-drop:
    number: 2-0-7
    default_pulse_ms: 25

    # Cobra chain 0 (board 0x20) - flipper coils
    # DRAFT flipper coils (Phase 1, plans/resumption-roadmap.md) - single main_coil per side,
    # no hold_coil/eos_switch since the EOS is mechanical/self-contained inside the coil
    # assembly and not wired back to the controller.
    #
    # Board assignment moved from the PSOC chain (2-1-x) to the Cobra board (chain 0) per user
    # decision - flippers are timing-critical, and CobraPin's own docs (docs.missionpinball.org/
    # hardware/opp/cobrapin) say timing-critical devices should have their switch+coil on the
    # same STM32 board for a hardware autofire rule with minimal latency. 0-0-2/0-0-3 are read
    # directly off board Overviews.xlsx's "Cobrapin - Game Funtion" sheet pin dump (part of the
    # free 4-pin coil bank containing 0-0-1/2/3/4) and cross-checked against
    # tools/hw_console/data/components.yaml + hardware-basic.yaml's scan (chain 0 board 0x20 has
    # 16 free solenoid outputs, all otherwise unused). Still DRAFT - not confirmed by a physical
    # continuity check on the real board yet, see TODO.md and design/physical-checklists/
    # wiring-guide.html.
    #
    # CORRECTION to the roadmap's original assumption: MPF's flipper device still requires a
    # nonzero default_hold_power even with no hold_coil/eos_switch - confirmed by reading
    # mpf/devices/flipper.py directly, it asserts "Cannot enable driver with hold_power 0.0"
    # and always builds a pulse+hold hardware rule (_enable_single_coil_rule) for this shape of
    # config. default_hold_power: 1.0 (full, unreduced) is the right value here specifically
    # because this hardware's hold winding is driven by the SAME activation signal as the power
    # winding (per the roadmap's own EOS research) - there's no separate PWM-reduced hold
    # winding for the controller to under-power, so a reduced hold_power would be wrong, not
    # just unnecessary.
  c-flipper-left:
    number: 0-0-2
    default_pulse_ms: 25
    default_hold_power: 1.0
  c-flipper-right:
    number: 0-0-3
    default_pulse_ms: 25
    default_hold_power: 1.0

    # DRAFT right ramp diverter coil (CAD-confirmed real hardware - Diverter_Rod/Diverter_Base/
    # Bridge_Diverter_Cover feeding a Subway tunnel, see
    # design/research/onshape-cad-findings.md). NOT confirmed against board Overviews.xlsx or a
    # physical continuity check yet, same status as the flipper coils above. `type: hold` (not
    # pulse) since a diverter physically holds a gate open/closed rather than firing a one-shot
    # kick - matches MPF's diverters: default `type: hold`. No game logic wired to it yet
    # (activate_events/deactivate_events) - what a diverted shot should actually do is a real
    # design question flagged in design/features/ramps.yaml, not answered by this hardware draft.
    # default_hold_power: 1.0 needed for the same reason as the flipper coils above - MPF asserts
    # "Cannot enable driver with hold_power 0.0" for any hold-type driver, confirmed the hard way
    # here too (ball search tried to pulse this coil and crashed the test event loop without it).
  c-ramp-diverter:
    number: 2-1-2
    default_hold_power: 1.0
