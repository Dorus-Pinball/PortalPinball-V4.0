# Ball trough opto bridge - see plans/read-opto.md for the bare-ATmega328P bridge build that
# replaces the fragile hand-soldered taps on the Stern trough opto board. Landed 2026-09-27 on
# chain2-0x20 (2-0-16...22) - NOT chain2-0x21 as the build plan and board Overviews.xlsx's
# design sheet call for (docs/board-silkscreen-reference.md), and NOT the same slot the old
# soldered taps used. Confirmed live: tools/wiring_test.py --monitor showed exactly these 7
# addresses firing together while sweeping a hand across all 7 sensors. Per the user, live
# hardware is authoritative over the design sheet here. This reclaimed s-toplane1/2/3's and
# s-orbit-r's DRAFT placeholder numbers (2-0-19/20/21/22) - moved to 2-0-0/1/2/3 above (see the
# Autofire 2-0-0 to 2-0-3 comment), still not physically wired.
# type: NC per the bridge firmware's BIT_INVERT=true on all channels (commit 14b9943, 2026-09-27):
# an OPP input reads closed when pulled low, NC inverts that. Still to be confirmed on the
# cabinet - the old "s-trough-jam active = clear path" note came from the damaged original taps
# and is superseded by this firmware fix (active should now mean jammed, matching the name).
  s-trough1:
    number: 2-0-16
    type: NC
  s-trough2:
    number: 2-0-17
    type: NC
  s-trough3:
    number: 2-0-18
    type: NC
  s-trough4:
