# Cobra chain 0 (board 0x20) - flipper activation switches. Board assignment moved from the
# PSOC chain (2-1-x) to the Cobra board per user decision, to land each flipper's switch on the
# SAME physical board as its coil (c-flipper-left/right in hardware-coils.yaml are 0-0-8/0-0-9,
# also chain 0) - CobraPin's own docs say timing-critical devices (flippers, slings, pops) need
# switch+coil on the same STM32 board for a hardware autofire rule. 0-0-1/0-0-2 are the actual
# pins used for real physical wiring (2026-09-06, confirmed by the user while wiring) -
# supersedes the earlier 0-0-9/0-0-10 guess read off board Overviews.xlsx's "Cobrapin - Game
# Funtion" sheet. Still pending a physical continuity check on the real board, see TODO.md and
# design/physical-checklists/wiring-guide.html.
  s-left-flipper:
    number: 0-0-1
    debounce: quick
    tags: flipper_left
  s-right-flipper:
    number: 0-0-2
    debounce: quick
    tags: flipper_right

# s-left-sling/s-right-sling moved here from the PSOC red board (were 2-0-1/2-0-0), 2026-09-13,
# same migration pattern as the flippers/plunger/trough - lands the switch on the same physical
# Cobra board as its paired coil (c-sling-left/c-sling-right in hardware-coils.yaml, also chain 0).
  s-left-sling:
    number: 0-0-25
    debounce: quick
  s-right-sling:
    number: 0-0-24
    debounce: quick

# New ball-saver post position switch, 2026-09-13. Senses which of the two positions
# (up/down) the post is currently in - see c-ball-saver in hardware-coils.yaml, a short pulse
# with no hold power that kicks the post between the two positions.
  s-ball-saver:
    number: 0-0-19

# s-start/s-launch wired onto the same Cobra chain 0 board while the user was there for the
# flippers (2026-09-06). s-launch tested PASS on 0-0-3. s-start was first wired to 0-0-8, which
# read stuck CLOSED regardless of press/release - confirmed root cause via the CobraPin
# board-config toolchain: that board's servo config dedicates inputs 0-0-8..11 to servo/PWM (see
# docs/opp-hardware-reference.md and registry.RESERVED_NUMBERS) - moved to 0-0-27 and PASSED.
  s-launch:
    number: 0-0-3
    tags: launch
  s-start:
    number: 0-0-27
    tags: start

