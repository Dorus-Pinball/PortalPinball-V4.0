#config_version=6
mode:
  start_events: ball_starting
  priority: 90

# DRAFT scoring - placeholder point values pending a real game-balance pass with the user.
# Replaces the flat 100-per-switch placeholder that used to live in modes/base/config/base.yaml.
# The "spell"/2x-hit lit-orange-blinking mechanic from board Overviews.xlsx is NOT implemented
# yet - design/features/lanes.yaml flags that story hook as "proposed, not yet confirmed with
# the user", so this doesn't build the full spell state machine.
#
# Per-shot LED feedback IS implemented now (2026-08-27), kept deliberately simple rather than
# guessing at the unconfirmed spell behavior: each lane lights gold (matching the slide's
# gold iconography) on its first hit and stays lit for the rest of the ball - a plain
# "have I hit this one yet" indicator, not the 2x-blink spell. Clears automatically at the next
# ball_starting, since light_player entries are mode-scoped and lanes restarts every ball.
# led-lane-b5 is a newly-drafted LED (hardware-leds.yaml, chain 1 - previously only 4 existed for
# 5 bottom lane switches, flagged in design/features/lanes.yaml).

shots:
  shot_toplane1:
    switch: s-toplane1
  shot_toplane2:
    switch: s-toplane2
  shot_toplane3:
    switch: s-toplane3

  shot_bottomlane1:
    switch: s-bottomlane1
  shot_bottomlane2:
    switch: s-bottomlane2
  shot_bottomlane3:
    switch: s-bottomlane3
  shot_bottomlane4:
    switch: s-bottomlane4
  shot_bottomlane5:
    switch: s-bottomlane5

shot_groups:
  top_lanes:
    shots: shot_toplane1, shot_toplane2, shot_toplane3
  bottom_lanes:
    shots: shot_bottomlane1, shot_bottomlane2, shot_bottomlane3, shot_bottomlane4, shot_bottomlane5

variable_player:
  shot_toplane1_hit:
    score: 500
  shot_toplane2_hit:
    score: 500
  shot_toplane3_hit:
    score: 500
  shot_bottomlane1_hit:
    score: 250
  shot_bottomlane2_hit:
    score: 250
  shot_bottomlane3_hit:
    score: 250
  shot_bottomlane4_hit:
    score: 250
  shot_bottomlane5_hit:
    score: 250
  top_lanes_complete:
    score: 2500
  bottom_lanes_complete:
    score: 1500

slide_player:
  top_lanes_complete:
    lanes_hit:
      priority: 200
      expire: 2s
  bottom_lanes_complete:
    lanes_hit:
      priority: 200
      expire: 2s

light_player:
  shot_toplane1_hit:
    led-toplane1: gold
  shot_toplane2_hit:
    led-toplane2: gold
  shot_toplane3_hit:
    led-toplane3: gold
  shot_bottomlane1_hit:
    led-lane-b1: gold
  shot_bottomlane2_hit:
    led-lane-b2: gold
  shot_bottomlane3_hit:
    led-lane-b3: gold
  shot_bottomlane4_hit:
    led-lane-b4: gold
  shot_bottomlane5_hit:
    led-lane-b5: gold
