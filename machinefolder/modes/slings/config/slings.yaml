#config_version=6
mode:
  start_events: ball_starting
  priority: 90

# DRAFT scoring - placeholder point values pending a real game-balance pass with the user.
# "Sling Combo" (board Overviews.xlsx) implemented as a 3-hit `sequences:` logic block: either
# sling counts for each of the 3 steps (Util.string_to_event_list lets a step accept alternative
# events), so this is "3 sling hits, either side", not order-specific - verified against the
# installed MPF's mpf/devices/logic_blocks.py source directly, since the design doc's original
# "ordered steps" framing doesn't match what a plain N-hits combo needs.
#
# Time window ("back-to-back" per the xlsx) IMPLEMENTED via a `timers:` device rather than
# `logic_block_timeout` - that setting starts ticking from mode/logic-block *enable* (ball start),
# not from the first hit (confirmed by reading enable()/_logic_block_timer_start() in
# logic_blocks.py), so it can't express "N seconds between hits". `sling_combo_window` is a
# 3-second up-timer that `restart()`s (reset+start) on every sling hit - a sliding window that
# extends with each hit rather than a fixed deadline from the first one - and resets the sequence's
# progress via `reset_events` if it ever completes (i.e. 3+ seconds pass with no further hit).
# `timer.restart()` starts the timer if not already running, so the very first hit both arms the
# window and registers as sequence step 0 - no separate "arm" event needed.

shots:
  shot_sling_l:
    switch: s-left-sling
  shot_sling_r:
    switch: s-right-sling

timers:
  sling_combo_window:
    direction: up
    tick_interval: 1s
    end_value: 3
    control_events:
      - action: restart
        event: s-left-sling_active
      - action: restart
        event: s-right-sling_active
      - action: stop
        event: logicblock_sling_combo_complete

sequences:
  sling_combo:
    reset_events: timer_sling_combo_window_complete
    events:
      - s-left-sling_active, s-right-sling_active
      - s-left-sling_active, s-right-sling_active
      - s-left-sling_active, s-right-sling_active

variable_player:
  shot_sling_l_hit:
    score: 100
  shot_sling_r_hit:
    score: 100
  logicblock_sling_combo_complete:
    score: 750

slide_player:
  logicblock_sling_combo_complete:
    sling_hit:
      priority: 200
      expire: 2s
