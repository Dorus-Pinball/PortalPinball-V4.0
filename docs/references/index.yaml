# External reference archive manifest - the source of truth for docs/references/index.md,
# which tools/hw_console/generate_docs.py renders from this file. Add a new entry here (and save
# a copy under docs/references/raw/<slug>/content.md) whenever a new external source gets cited
# in any project doc - see the project CLAUDE.md's "Key facts" for the convention.
#
# One-time sweep, 2026-09-13: archived the sources already cited in docs/opp-hardware-reference.md,
# docs/stern-spike-trough-opto.md, and the highest-value prose/reference pages from
# plans/OutsidePerspective.md - not a fresh research pass, and not every URL in that file (plain
# GitHub repo landing pages and 403/snippet-only forum threads were skipped, low link-rot risk or
# nothing durable to save).

