id: portal
name: Portal ball transfer
status: implementing
phase: Phase 3

story:
  hook: >
    TBD - needs a full narrative pass, but this is the game's namesake feature (a ball
    physically enters a "dropper" and re-emerges via a "portal" exit), so it's the
    natural anchor point for the machine's central Portal-theme story beat once one
    is written. Proposed motif (from theme research): the transfer moment maps well onto
    Portal 2's Conversion Gel (white - makes any surface portal-able), since this is
    literally the feature where a portal gets made and used.
    See design/research/portal-themes-and-pinball-design.md.

shots:
  - ref: s-dropper
    role: ball enters the transfer device here
  - ref: s-portal-r
    role: portal transfer switch (right)
  - ref: s-portal-m
    role: portal transfer switch (middle)
  - ref: s-exit-success
    role: successful exit confirmation switch
  - ref: led-dropper
    role: feedback LED
  - ref: led-portal-r
    role: feedback LED
  - ref: led-portal-m
    role: feedback LED
  - ref: led-exit-success
    role: feedback LED
  - ref: led-exit-open-1
    role: staged progression LED 1 of 5
  - ref: led-exit-open-2
    role: staged progression LED 2 of 5
  - ref: led-exit-open-3
    role: staged progression LED 3 of 5
  - ref: led-exit-open-4
    role: staged progression LED 4 of 5
  - ref: led-exit-open-5
    role: staged progression LED 5 of 5

rules:
  mode: portal
  devices:
    - type: sequence
      name: portal_sequence
      notes: >
        CORRECTED from the original "accrual" choice: accruals complete in ANY order
        (verified against the installed MPF's mpf/devices/logic_blocks.py source
        directly) - the dropper -> portal-r/m -> exit-success ordering needs
        `sequences:` instead, same correction already applied to
        dropbank.yaml's insinerator_finisher. Implemented in
        modes/portal/config/portal.yaml.
    - type: achievement
      name: exit_open_1..5 (x5, chained by config - NOT wrapped in an achievement_group)
      notes: >
        IMPLEMENTED (2026-08-27), correcting two earlier findings on re-verification against
        mpf/devices/achievement.py and mpf/devices/achievement_group.py directly:
        (1) `achievements:` DOES default `events_when_completed` to a clean, distinctly-named
        `achievement_<name>_state_completed` event whenever it's not explicitly set
        (validate_and_parse_config fills it in) - the earlier "no clean completed event" finding
        only looked at the generic `changed_state` event and missed this. Each stage's
        `enable_events` chains off the previous stage's default completion event.
        (2) `achievement_group` is the wrong device type for a fixed linear chain - it's built for
        "select one achievement from several and pursue it" (rotation/random-select semantics),
        not sequential gating, and wrapping the chain in one would risk the group's own
        enable()/select() logic fighting the manual enable_events chain for no benefit. A plain
        set of 5 achievements chained by their own default completion events is both simpler and
        the better semantic fit. Real bug found and fixed along the way: `disable_on_complete`
        defaults to `true` for ALL logic_blocks (mpf/config_spec.yaml's logic_blocks_common) -
        portal_sequence needed `disable_on_complete: false` explicitly, or it would only ever
        complete once per ball (permanently disabling itself right after its one completion),
        which would have capped this chain at stage 1 forever. Implemented in
        modes/portal/config/portal.yaml, verified in tests/test_portal.py (5 repeat completions
        light all 5 stages; progress persists across balls since Achievement state lives on the
        player, not the mode). `led-exit-open-1..5` are lit via `light_player:` on each stage's
        completion event (purple, matching the slide's violet accent) - the first `light_player:`
        usage in this codebase; no other mode drives LEDs yet.
  scoring: >
    DRAFT, needs a real game-balance pass with the user: 200/hit for dropper/portal-r/portal-m,
    500/hit for exit-success, +5000 for the full ordered sequence completing, +1000 per exit_open
    stage (1-4), +10000 for the 5th/final stage (`portal_all_exits_open` - now consumed by
    `modes/progression/config/progression.yaml`'s `wizard_gate` accrual as the Phase 5
    wizard-mode gate's deliberate final required key, alongside the 3 feature tiers). Implemented
    in modes/portal/config/portal.yaml.

presentation:
  slide: modes/portal/slides/portal_transfer.tscn - implemented with blue/orange entry-exit
    ring icons linked by a dashed violet transit arc (the page's only violet accent) on a
    violet-tinted panel, per the approved "Aperture Display Signage" graphics proposal.
  show: modes/portal/shows/portal_transfer.yaml - implemented (2026-08-27) as a burn-open chase
    across the 4 transfer-path LEDs (dropper -> portal-r -> portal-m -> exit-success) on full
    sequence completion. The led-exit-open-1..5 progression is handled separately by the
    achievement chain's own light_player (each stage lights on its own completion), not a
    dedicated chase show.
  sound: machinefolder/sounds/sfx/portal_dropper_whoosh.wav (dropper entry) +
    portal_exit_chime.wav (exit success) - implemented (2026-08-27) from the user's Portal 2
    sound extract, real portal-gun fire and fizzle SFX. DRAFT pick, user plans to review/adjust
    manually.

notes: >
  Most involved feature in Phase 3 (multi-switch ball-tracking state machine) -
  build it last, once the simpler shot_group pattern is proven out by lanes/orbits,
  per plans/resumption-roadmap.md. The playfield schematic
  (design/research/onshape-cad-findings.md) showed three "Duplicate Exit" fragments
  near the top-left - confirmed by the user to just be one Exit part split into 3
  pieces for 3D-printing, not three separate mechanisms. That was a dead end, not a
  lead: the ball-lock "portal" hole-pairing mechanic the user described (hole A holds
  a ball, hole B capturing a new ball instantly releases A - giving a teleport effect)
  is now RESOLVED (2026-08-27): the CAD does not support it. Opened balldropper/VUK/Exit/
  DropperAssy directly - VUK/VUK-high/Exit are unused orphaned stub part studios (a single
  bracket or cover each), never instanced in the real top-level assembly. The actual built
  machine has exactly one DropperAssy (single valve/riser actuator) feeding a passive Subway/
  Tube path to a single `Portal Vuk` exit - one linear path, no second capture point, no
  linkage that could release one ball when another is captured. See
  design/research/onshape-cad-findings.md's "Resolved" section for full detail. This confirms
  (rather than contradicts) the sequence-based rules below: a strictly ordered
  dropper -> transfer -> exit path is what the physical machine actually is. If the
  instant-teleport pairing effect is still wanted, it needs new physical design (a second
  capture point + coordinating mechanism), not something achievable via MPF config alone.
