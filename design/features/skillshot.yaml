id: skillshot
name: Launch skillshot
status: implementing
phase: Phase 3

story:
  hook: >
    Proposed (from theme research, not yet confirmed with the user): the first shot of
    each ball pairs naturally with "the first test" framing - GLaDOS's opening line/chamber
    intro beat, right as the ball launches. See design/research/portal-themes-and-pinball-design.md.

shots:
  - ref: s-launch
    role: player-controlled plunge trigger (bd-plunger's player_controlled_eject_event)
  - ref: s-plunger-lane
    role: ball-in-plunger-lane confirmation switch
  - ref: led-launch
    role: feedback LED
  - ref: led-save
    role: feedback LED near the plunger lane
  - ref: s-toplane1
    role: candidate skillshot target (rotating-lane proposal, see notes)
  - ref: s-toplane2
    role: candidate skillshot target (rotating-lane proposal, see notes)
  - ref: s-toplane3
    role: candidate skillshot target (rotating-lane proposal, see notes)

rules:
  mode: skillshot
  devices:
    - type: shot
      name: shot_skillshot
      notes: >
        one-shot at ball start, per plans/resumption-roadmap.md Phase 3. Pinball design
        research proposes two cheap additions, reusing hardware already wired: a "super
        skill shot" bonus window immediately after the base skill shot completes, and
        rotating which of the 3 top lanes counts as the skillshot each ball (round-robin) -
        the latter directly answers this file's own open question below, though it's
        still a proposal pending confirmation. See
        design/research/portal-themes-and-pinball-design.md Part 2.
  scoring: >
    DRAFT, needs a real game-balance pass with the user: 1000 flat bonus. Implemented in
    modes/skillshot/config/skillshot.yaml using the simplest safe baseline (ANY of the 3 top
    lanes counts, once per ball) rather than the rotating-lane proposal below, since that still
    needs the user's sign-off.

presentation:
  slide: modes/skillshot/slides/skillshot_hit.tscn - implemented as a placeholder yellow panel
    (no real art yet), per design/SCREENS.md.
  show: TBD - the lit/rotating top lane could pulse to show "this one counts" this ball
  sound: TBD - portal-fire whoosh on launch; a short plucky test-chamber-style musical stinger on a made skillshot

notes: >
  Open design question, not yet fully decided: which specific shot actually counts as
  "making" the skillshot? Theme/design research above proposes rotating across the 3 top
  lanes each ball rather than a single fixed lane - a reasonable default, but still needs
  the user's sign-off before implementation.

  Onshape CAD confirms `shooter ramp` sits directly beside `Rail_Shooterlane`/`Rail_Trough`
  at the bottom of the playfield, exactly where s-launch/s-plunger-lane are expected - but
  CAD geometry can't resolve the "which lane counts" question above, that's a rules decision.
  See design/research/onshape-cad-findings.md.
