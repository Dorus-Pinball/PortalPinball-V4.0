id: aerial
name: Aerial plate
status: implementing
phase: Phase 3

story:
  hook: >
    Confirmed twice over: theme research identified this as a direct reference to
    Portal 2's "Aerial Faith Plate" (a real licensed Multimorphic "Portal" pinball
    machine has a mechanism with this exact name), and the actual CAD confirms it
    directly - a part literally named "Faithplate walls" exists on the playfield
    (~4.7"x8.3", sitting mid-left, roughly a third of the way up from the shooter
    lane). "Aerial" here isn't a generic term - it's the Faith Plate, by design intent
    as well as by name. See design/research/portal-themes-and-pinball-design.md and
    design/research/onshape-cad-findings.md.

shots:
  - ref: s-aerial
    role: aerial plate switch
  - ref: led-aerial
    role: feedback LED

rules:
  mode: aerial
  devices:
    - type: shot
      name: shot_aerial
      notes: >
        currently just a switch with no logic - simplest feature to implement, per
        plans/resumption-roadmap.md Phase 3. Given no coil exists here, real-machine
        precedent (see research doc) suggests treating this as a mode-qualifying step
        ("step on the plate to light something else") rather than a standalone scoring
        shot, since it has no natural "repeat and build" pattern the way a shot_group does.
  scoring: >
    DRAFT, needs a real game-balance pass with the user: 300/hit flat. Implemented in
    modes/aerial/config/aerial.yaml as a single flat-scored shot, per the "mode-qualifying
    step, not a standalone scoring shot" note above being itself still undecided - this is the
    simplest safe baseline until that design pass happens.

presentation:
  slide: modes/aerial/slides/aerial_hit.tscn - implemented with a springboard plate + dotted
    ballistic-arc trail icon in "sky" cyan (distinct from portal-blue) on a matching tinted
    panel, per the approved "Aperture Display Signage" graphics proposal.
  show: modes/aerial/shows/aerial_hit.yaml - implemented (2026-08-27) as a white-to-cyan launch
    flash. The "ballistic-arc trail" half isn't representable - only one LED (led-aerial) exists
    here.
  sound: TBD - a quick spring-launch whoosh (distinct from the portal-fire whoosh reserved for skillshot/portal)

notes: >
  board Overviews.xlsx's "Modes" sheet has a bare "aerial plate active" note and
  nothing else - the specific rules still need a design pass with the user. Hardware
  wishlist (not blocking, not in any phase yet): if an upkicker coil is ever added here,
  the standard real-machine use for this mechanism type is a multiball-lock feeder or a
  mode-start scoop (VUK pattern) - see design/research/portal-themes-and-pinball-design.md
  Part 2.
