id: dropbank
name: Drop target bank -> insinerator
status: implementing
phase: Phase 3

story:
  hook: >
    Proposed (inferred from the existing "s-insinerator" hardware name, not yet confirmed
    with the user): this reads as a direct reference to Portal 1's Companion Cube
    incineration beat, one of the game's most memorable moments (GLaDOS forces Chell to
    destroy the cube in an incinerator). Dropping the 3-target bank could represent
    clearing the cube's supports/path before the shot to the insinerator "completes" that
    beat. See design/research/portal-themes-and-pinball-design.md.

shots:
  - ref: s-drop1
    role: drop target 1 of 3 (bank device d-drop-target1)
  - ref: s-drop2
    role: drop target 2 of 3 (bank device d-drop-target2)
  - ref: s-drop3
    role: drop target 3 of 3 (bank device d-drop-target3)
  - ref: s-insinerator
    role: downstream target lit by bank completion
  - ref: s-button
    role: extra target near the button, per plans/resumption-roadmap.md Phase 3
  - ref: s-target-l1
    role: extra target near the button
  - ref: led-insinerator
    role: feedback LED
  - ref: led-button
    role: feedback LED
  - ref: led-target-l1
    role: feedback LED

rules:
  mode: dropbank
  devices:
    - type: drop_target_bank
      name: db-dropbank
      notes: already exists as a device in machinefolder/config/hardware-devices.yaml (reset_coils c-drop).
    - type: shot
      name: shot_insinerator
      notes: >
        fired by bank completion, per plans/resumption-roadmap.md Phase 3. Pinball design
        research: this is the textbook "bank completion unlocks a shot" pattern - MPF has
        a cookbook recipe for exactly this (missionpinball.org/latest/cookbook/
        sequential_drop_banks/, uses a `sequence` block). Standard real-machine shape is
        escalating value per repeat completion rather than flat scoring each time, since
        the bank auto-resets via c-drop.
    - type: sequence
      name: insinerator_finisher
      notes: >
        CORRECTED from the original "accrual" choice: accruals complete in ANY order
        (verified against the installed MPF's mpf/devices/logic_blocks.py source directly)
        - an ordered insinerator -> button -> target-l1 finisher needs `sequences:`
        instead. Same correction will apply to portal.yaml's dropper->portal->exit
        accrual when that feature is built. No time window enforced yet (flat ordered
        completion only), matching the same gap noted in slings.yaml.
  scoring: >
    DRAFT, needs a real game-balance pass with the user: +1000 for bank completion
    (drop_target_bank_db-dropbank_down), 500/hit for the insinerator shot (flat, no
    escalating-value-per-repeat-completion yet), +2000 for the ordered
    insinerator->button->target-l1 finisher. Implemented in
    modes/dropbank/config/dropbank.yaml.

presentation:
  slide: modes/dropbank/slides/dropbank_hit.tscn - implemented as a placeholder red/orange
    panel (no real art yet), per design/SCREENS.md.
  show: TBD - fire/incinerator flame-wipe flash on the insinerator shot, per the theme research's escape/incinerator sting idea
  sound: TBD - crackling flame whoosh on insinerator hit; a companion-cube "clunk-chime" per drop target, if the story hook above is confirmed

notes: >
  The 3 raw drop targets (s-drop1-3) have no individual feedback LEDs in
  hardware-leds.yaml today - only the downstream insinerator/button/target-l1 targets
  do. Worth confirming whether that's intentional (bank itself isn't meant to light up
  per-target) before building the mode's LED logic.

  Onshape CAD: no part or assembly named for a 3-target drop bank or an "insinerator"
  mechanism exists anywhere in the document - a genuine open gap, same category as the
  ball-lock hole-pairing question in portal.yaml. A dedicated `Button` assembly does exist
  and directly matches s-button. See design/research/onshape-cad-findings.md.
