id: orbits
name: Left & right orbits
status: implementing
phase: Phase 3

story:
  hook: >
    Proposed (from theme research, not yet confirmed with the user): the clean left/right
    pair maps naturally onto the game's blue/orange portal pairing (e.g. blue = left
    orbit, orange = right orbit), and a ball looping at speed around an orbit echoes the
    game's momentum-conservation-through-portals mechanic.
    See design/research/portal-themes-and-pinball-design.md.

shots:
  - ref: s-orbit-l
    role: left orbit entry switch
  - ref: s-orbit-r
    role: right orbit entry switch
  - ref: s-orbit-top
    role: orbit-top switch (right switch bank per board Overviews.xlsx)
  - ref: led-orbit-l
    role: feedback LED
  - ref: led-orbit-r
    role: feedback LED
  - ref: led-orbit-t
    role: feedback LED

rules:
  mode: orbits
  devices:
    - type: shot_group
      name: orbits
      notes: reuses the shot_group scaffolding built for lanes.yaml, per plans/resumption-roadmap.md Phase 2.
  scoring: >
    DRAFT, needs a real game-balance pass with the user: 750/hit for left/right orbit (major
    loop shots), 100/hit for the orbit-top rollover, +3000 group-complete bonus for hitting all
    three at least once. Implemented in modes/orbits/config/orbits.yaml.

presentation:
  slide: modes/orbits/slides/orbit_hit.tscn - implemented with two interlocked ellipse-ring
    icons in blue (left)/orange (right) on a matching split-tinted panel, per the approved
    "Aperture Display Signage" graphics proposal.
  show: modes/orbits/shows/orbit_hit.yaml - implemented (2026-08-27) as a white-pop-to-color
    flash, blue for left / orange for right / white for top.
  sound: machinefolder/sounds/sfx/orbits_whoosh.wav - implemented (2026-08-27) from the user's
    Portal 2 sound extract, one whoosh for all 3 shots (the show's per-side color already
    differentiates them). DRAFT pick, user plans to review/adjust manually.

notes: >
  `orbit` is already referenced (commented out) in machinefolder/config/config.yaml's
  modes: list - this feature fulfills that placeholder.

  Onshape CAD confirms `left orbit`/`right orbit` as real, large named parts spanning most of
  the upper third of the playfield (~10.0" x 13.6" left, ~2.1" x 12.9" right) - directly
  confirms the shots above, though the two sides aren't the same shape/size, worth keeping in
  mind for the "clean pair" framing. See design/research/onshape-cad-findings.md.
