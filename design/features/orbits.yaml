id: orbits
name: Left & right orbits
status: designed
phase: Phase 3

story:
  hook: >
    Proposed (from theme research, not yet confirmed with the user): the clean left/right
    pair maps naturally onto the game's blue/orange portal pairing (e.g. blue = left
    orbit, orange = right orbit), and a ball looping at speed around an orbit echoes the
    game's momentum-conservation-through-portals mechanic.
    See design/research/portal-themes-and-pinball-design.md.

shots:
  - ref: s_orbit-l
    role: left orbit entry switch
  - ref: s_orbit-r
    role: right orbit entry switch
  - ref: s-orbit-top
    role: orbit-top switch (right switch bank per board Overviews.xlsx)
  - ref: led-orbit-l
    role: feedback LED
  - ref: led-orbit-r
    role: feedback LED
  - ref: led-orbit-t
    role: feedback LED

rules:
  mode: orbits
  devices:
    - type: shot_group
      name: orbits
      notes: reuses the shot_group scaffolding built for lanes.yaml, per plans/resumption-roadmap.md Phase 2.
  scoring: TBD

presentation:
  slide: TBD - no dedicated slide yet
  show: TBD - portal-ring "pop" flash on the relevant orbit icon, blue for left / orange for right
  sound: TBD - a rising-pitch whoosh sweep (momentum/speed motif) distinct per side

notes: >
  `orbit` is already referenced (commented out) in machinefolder/config/config.yaml's
  modes: list - this feature fulfills that placeholder.
