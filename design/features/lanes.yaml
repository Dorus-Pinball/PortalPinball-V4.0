id: lanes
name: Top & bottom lanes
status: implementing
phase: Phase 3

story:
  hook: >
    Proposed for the top lanes only (from theme research, not yet confirmed with the
    user): a "turret gauntlet" - 3 lanes as 3 turrets to knock down, matching the
    2x-hit/"complete" spell mechanic already planned below (each turret needs a second
    hit to topple). Bottom lanes (5) still have no proposed hook - genuinely open.
    See design/research/portal-themes-and-pinball-design.md.

shots:
  - ref: s-toplane1
    role: top lane shot 1 of 3
  - ref: s-toplane2
    role: top lane shot 2 of 3
  - ref: s-toplane3
    role: top lane shot 3 of 3
  - ref: led-toplane1
    role: feedback LED
  - ref: led-toplane2
    role: feedback LED
  - ref: led-toplane3
    role: feedback LED
  - ref: s-bottomlane1
    role: bottom lane shot 1 of 5
  - ref: s-bottomlane2
    role: bottom lane shot 2 of 5
  - ref: s-bottomlane3
    role: bottom lane shot 3 of 5
  - ref: s-bottomlane4
    role: bottom lane shot 4 of 5
  - ref: s-bottomlane5
    role: bottom lane shot 5 of 5
  - ref: led-lane-b1
    role: feedback LED
  - ref: led-lane-b2
    role: feedback LED
  - ref: led-lane-b3
    role: feedback LED
  - ref: led-lane-b4
    role: feedback LED
  - ref: led-lane-b5
    role: feedback LED

rules:
  mode: lanes
  devices:
    - type: shot_group
      name: top_lanes
      notes: >
        "spell"/2x-hit mechanic per board Overviews.xlsx ("Top Lanes Complete: spells...
        orange when hit 2x... blinking") - use MPF shot profile states (lit/unlit/flashing)
        rather than a hand-rolled counter, per plans/resumption-roadmap.md Phase 2.
    - type: shot_group
      name: bottom_lanes
  scoring: >
    DRAFT, needs a real game-balance pass with the user: 500/hit for top lanes (harder shot),
    250/hit for bottom lanes, +2500 group-complete bonus for top lanes, +1500 for bottom lanes.
    Implemented in modes/lanes/config/lanes.yaml, replacing base.yaml's old flat-100 placeholder.

presentation:
  slide: modes/lanes/slides/lanes_hit.tscn - implemented with an original hazard-gold line-art
    icon (three peaked posts, deliberately abstract given the turret hook is unconfirmed) on a
    dark tinted panel, per the approved "Aperture Display Signage" graphics proposal. Plays on
    both top_lanes_complete/bottom_lanes_complete.
  show: modes/lanes/shows/lanes_hit.yaml - implemented (2026-08-27) as a simple white-pop-to-gold
    flash per lane hit, layered over the persistent gold light_player state, not the full
    turret-gauntlet animation (still unconfirmed).
  sound: TBD - turret chirp on first hit, comedic "dying" wobble/cry on the completing second hit

notes: >
  Only 4 "lane-b" LEDs exist (led-lane-b1..b4) for 5 bottom lane switches
  (s-bottomlane1..5) - one bottom lane currently has no dedicated feedback LED.
  Worth confirming against the cabinet before finalizing the shot_group's LED mapping.
  **Fixed (2026-08-27)**: added `led-lane-b5` as DRAFT hardware (chain 1 - a second, real,
  scanned LED-driver board that was completely unused, per `hardware-basic.yaml`'s scan
  comment), and wired simple `light_player:` feedback for all 8 lane shots (gold on first hit,
  stays lit for the rest of the ball - not the unconfirmed 2x-blink spell, just a plain "hit
  it yet" indicator). Verified in `tests/test_lanes.py`.

  Onshape CAD: `toprail` is a real large part spanning nearly the full top ~40% of the
  playfield, consistent with being the backing rail behind the 3 top lanes - but no
  individual per-lane parts exist, and no turret/rotating/pop-up mechanism was found near
  the top lanes, so the "turret gauntlet" story hook above remains unconfirmed by CAD (a
  `popup post` assembly exists in the document but its position wasn't checked). Bottom
  lanes still have zero identified CAD geometry. See design/research/onshape-cad-findings.md.
