id: slings
name: Sling combo
status: implementing
phase: Phase 3

story:
  hook: >
    Proposed (from theme research, not yet confirmed with the user): a sling's bounce
    action is a close match for Portal 2's Repulsion Gel (blue - bounces objects like a
    trampoline). See design/research/portal-themes-and-pinball-design.md.

shots:
  - ref: s-left-sling
    role: left sling switch (also drives the ac-sling-left autofire coil)
  - ref: s-right-sling
    role: right sling switch (also drives the ac-sling-right autofire coil)
  - ref: led-sling-l
    role: feedback LED
  - ref: led-sling-r
    role: feedback LED

rules:
  mode: slings
  devices:
    - type: sequence
      name: sling_combo
      notes: >
        "Sling Combo" mechanic named explicitly in board Overviews.xlsx - back-to-back
        sling hits within a time window. MPF's `sequence` logic block (time-pressure,
        N hits within a timeout) is the right fit, not a plain counter - confirmed as the
        standard real-machine pattern for this kind of combo by the pinball design
        research (design/research/portal-themes-and-pinball-design.md Part 2).
  scoring: >
    DRAFT, needs a real game-balance pass with the user: 100/hit per sling (unchanged from the
    old base.yaml placeholder), +750 combo-complete bonus for 3 hits (either side).
    Implemented in modes/slings/config/slings.yaml as a `sequences:` logic block - NOTE: the
    "back-to-back within a time window" part of the mechanic is not yet implemented, see that
    file's comments (logic_block_timeout doesn't mean what its name suggests here - it starts
    from mode/logic-block enable, not from the first hit). Flagged in TODO.md.

presentation:
  slide: modes/slings/slides/sling_hit.tscn - implemented with a blue bounce-arc icon (plus a
    fainter echo arc implying the combo building) on a blue-tinted dark panel, per the approved
    "Aperture Display Signage" graphics proposal. Plays on the combo-complete event.
  show: TBD - a blue springy squash-and-bounce flash on the sling icon, per the Repulsion Gel motif
  sound: TBD - a springy "boing" per hit, building to a distinct combo-complete sting

notes: >
  Onshape CAD confirms `Slingshot Rubber Left`/`Slingshot Rubber Right` as real named parts
  (~2.05" x 4.45" each) in the lower-middle of the playfield near the flipper zone - directly
  confirms the shots above with no ambiguity. See design/research/onshape-cad-findings.md.
