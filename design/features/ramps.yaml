id: ramps
name: Left & right ramps
status: designed
phase: Phase 3

story:
  hook: >
    Proposed (from theme research, not yet confirmed with the user): a ramp is a close
    visual match for Portal 2's Hard Light Bridge - a solid, glowing energy platform you
    cross. See design/research/portal-themes-and-pinball-design.md.

shots:
  - ref: s-ramp-l1
    role: left ramp switch 1 of 2
  - ref: s-ramp-l2
    role: left ramp switch 2 of 2
  - ref: s-ramp-r1
    role: right ramp switch 1 of 2
  - ref: s-ramp-r2
    role: right ramp switch 2 of 2
  - ref: led-ramp-l
    role: feedback LED
  - ref: led-ramp-r
    role: feedback LED

rules:
  mode: ramps
  devices:
    - type: shot_group
      name: ramps
    - type: sequence
      name: ramp_combo
      notes: >
        pinball design research: 2 switches per ramp (entry+exit) with no diverter
        hardware most likely just confirms a completed make, not routing. The standard
        real-machine use for a symmetric L/R ramp pair like this is a `sequence` block
        rewarding ramp-to-ramp combos (left ramp -> right ramp within N seconds), or a
        repeat-ramp bonus-multiplier build - either reuses hardware already wired, no new
        parts needed. See design/research/portal-themes-and-pinball-design.md Part 2.
  scoring: TBD

presentation:
  slide: TBD - no dedicated slide yet
  show: TBD - glowing "bridge extends" animation across the ramp icon while lit, per the Hard Light Bridge motif
  sound: TBD - propulsion-gel-style "zip" whoosh (orange gel = frictionless speed boost) as the ramp-make sound

notes: >
  Lowest-priority Phase 3 feature - board Overviews.xlsx's "Modes" sheet notes are
  sparsest here ("right ramp", a bare "?" placeholder). Needs a real design pass with
  the user (what a ramp shot actually does/awards) before implementation, per
  plans/resumption-roadmap.md Phase 3. If a diverter/servo is ever added to the physical
  ramp later, standard use is alternating L/R routing to feed a physical ball lock for
  multiball - a hardware wishlist item, not currently planned.
