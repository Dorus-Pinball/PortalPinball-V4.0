id: ramps
name: Left & right ramps
status: implementing
phase: Phase 3

story:
  hook: >
    Confirmed via CAD: the physical playfield has parts literally named "light bridge
    rail right" / "light bridge rail left" flanking the right ramp - the Hard Light
    Bridge motif proposed from theme research wasn't a guess, it's already built.
    See design/research/onshape-cad-findings.md.

shots:
  - ref: s-ramp-l1
    role: left ramp switch 1 of 2
  - ref: s-ramp-l2
    role: left ramp switch 2 of 2
  - ref: s-ramp-r1
    role: right ramp switch 1 of 2
  - ref: s-ramp-r2
    role: right ramp switch 2 of 2
  - ref: led-ramp-l
    role: feedback LED
  - ref: led-ramp-r
    role: feedback LED

rules:
  mode: ramps
  devices:
    - type: shot_group
      name: ramps
    - type: sequence
      name: ramp_combo
      notes: >
        pinball design research: the standard real-machine use for a symmetric L/R ramp
        pair is a `sequence` block rewarding ramp-to-ramp combos (left ramp -> right ramp
        within N seconds), or a repeat-ramp bonus-multiplier build. Still applies
        regardless of the diverter finding below - this scores the *shot*, the diverter
        controls where the *ball* goes physically. See
        design/research/portal-themes-and-pinball-design.md Part 2.
    - type: other
      name: right_ramp_diverter
      notes: >
        CAD correction (design/research/onshape-cad-findings.md): the earlier "no
        diverter hardware" assumption was wrong. The playfield has a real
        Diverter_Rod + Diverter_Base + Bridge_Diverter_Cover assembly feeding a Subway
        tunnel right where the right ramp bottoms out - this is a genuine routing
        diverter, not just an entry/exit confirmation pair. MPF has a native
        `diverters:` device type for exactly this. NOT YET BUILDABLE: no diverter coil
        or subway entry/exit switches exist in hardware-coils.yaml/
        hardware-switches.yaml today - this needs real electrical wiring first, same
        gate as Phase 1 flippers. Flagged in TODO.md.
  scoring: >
    DRAFT, needs a real game-balance pass with the user: 400/hit per ramp (either l1/l2 or
    r1/r2 switch counts), +1500 shot_group-complete bonus for hitting both ramps, +1000 for the
    2-hit ramp_combo sequence. Implemented in modes/ramps/config/ramps.yaml. Does NOT implement
    the right_ramp_diverter routing device - genuinely hardware-blocked (no coil/switches wired
    yet), see TODO.md. No combo time window either, same gap as slings/dropbank/portal.

presentation:
  slide: modes/ramps/slides/ramps_hit.tscn - implemented with a solid ramp-shell arc paired
    with a dashed light-bridge energy-beam arc in propulsion-gel orange, on a matching tinted
    panel, per the approved "Aperture Display Signage" graphics proposal.
  show: TBD - glowing "bridge extends" animation across the ramp icon while lit, per the Hard Light Bridge motif
  sound: TBD - propulsion-gel-style "zip" whoosh (orange gel = frictionless speed boost) as the ramp-make sound

notes: >
  Lowest-priority Phase 3 feature - board Overviews.xlsx's "Modes" sheet notes are
  sparsest here ("right ramp", a bare "?" placeholder). Needs a real design pass with
  the user (what a ramp shot actually does/awards) before implementation, per
  plans/resumption-roadmap.md Phase 3. The diverter/subway isn't a hypothetical
  wishlist item anymore (as an earlier version of this file assumed) - it's built into
  the CAD already; standard real-machine use is alternating L/R routing to feed a
  physical ball lock for multiball, which is now a real near-term option once it's
  wired, not just a stretch goal. Real dimensions: right ramp bottom ~4.9"x9.6",
  light bridge rails ~12"-18" long. See design/research/onshape-cad-findings.md and
  the schematic artifact linked there.
