<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Portal Pinball - Hardware Console</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <h1>Portal Pinball - Hardware Bring-Up Console</h1>
  <nav>
    <button class="tab-btn active" data-tab="boards">Boards</button>
    <button class="tab-btn" data-tab="components">Status</button>
  </nav>
</header>

<main>
  <section id="tab-boards" class="tab active">
    <table id="boards-table">
      <thead>
        <tr><th>Board</th><th>Port</th><th>Role</th><th>Firmware</th><th>Status</th><th></th></tr>
      </thead>
      <tbody></tbody>
    </table>
  </section>

  <section id="tab-components" class="tab">
    <div class="components-layout">
      <div class="components-list-pane">
        <div class="list-controls">
          <select id="status-filter">
            <option value="">All statuses</option>
            <option value="1">1 - Idea, no hardware</option>
            <option value="2">2 - Hardware, no idea</option>
            <option value="3">3 - Hardware with a purpose</option>
            <option value="4">4 - Renovated, not wired</option>
            <option value="5">5 - Connected, not tested</option>
            <option value="6">6 - Ready (connected & tested)</option>
          </select>
          <button id="new-component-btn">+ Add element</button>
        </div>
        <ul id="components-list"></ul>
      </div>
      <div class="component-detail-pane" id="component-detail">
        <p class="placeholder">Select a component to see its switches, coils, board, and wiring checklist.</p>
      </div>
    </div>
  </section>
</main>

<dialog id="new-component-dialog">
  <form id="new-component-form">
    <h2>Add element</h2>
    <label>Internal ID (kebab-case)<input name="name" required pattern="[a-z0-9]+(-[a-z0-9]+)*"></label>
    <label>Display name<input name="display_name" required></label>
    <label>Status
      <select name="status">
        <option value="1" selected>1 - Idea, no hardware</option>
        <option value="2">2 - Hardware, no idea</option>
        <option value="3">3 - Hardware with a purpose</option>
        <option value="4">4 - Renovated, not wired</option>
        <option value="5">5 - Connected, not tested</option>
        <option value="6">6 - Ready (connected & tested)</option>
      </select>
    </label>
    <label>Notes<textarea name="notes" rows="2"></textarea></label>

    <p class="error" id="new-component-error" hidden></p>

    <div class="dialog-actions">
      <button type="button" id="cancel-new-component">Cancel</button>
      <button type="submit">Add</button>
    </div>
  </form>
</dialog>

<script src="/static/app.js"></script>
</body>
</html>
