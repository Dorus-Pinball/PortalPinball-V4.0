# Bank A coil wiring - every coil currently wired to CobraPin chain0-0x20's solenoid Bank A:
# c-flipper-left/right (0-0-8/9), c-sling-right (0-0-0), c-sling-left (0-0-12), c-ball-saver
# (0-0-13), c-plunger (0-0-10), c-trough-eject (0-0-11). Bank A has one more free position
# (0-0-14) not modeled here, per this project's convention of not tracking free capacity as
# structured data (see docs/opp-hardware-reference.md/TODO.md).
#
# Supersedes the old flipper-only flipper-bank-a.yaml (2026-09-06) - kept the same connector/cable
# split (HV_A: the shared fused-HV bus; DRIVER: the solenoid driver header; one small connector
# per coil) now extended to the other 5 coils. Confirmed with the user (2026-09-14): the flipper
# pair share one physical 4-pin "coil pack" connector (unchanged from the original file), but the
# other 5 coils are each independently wired - their own 2-wire pigtail back to the shared bus/
# header, not bundled with each other or the flippers.
#
# Real, sourced data - not a guess:
#   - Bank/HV-feed/wire-color: docs/opp-hardware-reference.md's "Full per-pin bank / HV-feed /
#     color reference" table.
#   - Pin numbers and confirmation this is the actual wiring (not DRAFT): components.yaml's
#     `flippers`, `autofire-slings`, `ball-saver`, `plunger-launch`, and `trough` entries -
#     every coil here is status 6 (wired & tested), confirmed via tools/wiring_test.py continuity
#     checks and live in a real game (see each component's own notes for its confirmation date).
#
# NOT modeled here: the flyback diode across each coil (WireViz models cable/connector routing,
# not discrete parallel components - see docs/opp-hardware-reference.md and the callout in
# wiring-guide.html's section 05 for diode orientation: cathode toward HV_A, anode toward the
# driver pin). Driver-signal wire colors aren't confirmed for any of these coils
# (opp-hardware-reference.md explicitly says not to assert one) - every W-DRV-* cable is left
# uncolored rather than guessing.
#
# Rendered into design/physical-checklists/wiring-guide.html and docs/wiring-guide.md by
# tools/hw_console/generate_docs.py - edit this file (and re-run the generator), never the
# rendered SVG/HTML/Markdown by hand.

connectors:
  HV_A:
    type: CobraPin J13, Bank A fused HV feed (shared bus terminal)
    pinlabels: [HV_A, HV_A, HV_A, HV_A, HV_A, HV_A, HV_A]
  DRIVER:
    type: CobraPin chain0-0x20 solenoid driver header, Bank A
    pinlabels: ["0-0-8", "0-0-9", "0-0-0", "0-0-12", "0-0-13", "0-0-10", "0-0-11"]
  COILS_FLIPPER:
    type: Flipper coil pack (left / right)
    pinlabels: ["c-flipper-left +", "c-flipper-left drv", "c-flipper-right +", "c-flipper-right drv"]
  COIL_SLING_R:
    type: Right sling coil
    pinlabels: ["c-sling-right +", "c-sling-right drv"]
  COIL_SLING_L:
    type: Left sling coil
    pinlabels: ["c-sling-left +", "c-sling-left drv"]
  COIL_BALL_SAVER:
    type: Ball saver post coil
    pinlabels: ["c-ball-saver +", "c-ball-saver drv"]
  COIL_PLUNGER:
    type: Auto-launch plunger coil
    pinlabels: ["c-plunger +", "c-plunger drv"]
  COIL_TROUGH_EJECT:
    type: Trough eject coil
    pinlabels: ["c-trough-eject +", "c-trough-eject drv"]

cables:
  W-HV-flipper:
    wirecount: 2
    colors: [BN, BN]
    gauge: 18 AWG
    type: HV_A feed (brown, per docs/opp-hardware-reference.md)
  W-DRV-flipper:
    wirecount: 2
    gauge: 18 AWG
    type: Driver signal (exact color not confirmed - see docs/opp-hardware-reference.md)
  W-HV-sling-r:
    wirecount: 1
    color: BN
    gauge: 18 AWG
    type: HV_A feed (brown, per docs/opp-hardware-reference.md)
  W-DRV-sling-r:
    wirecount: 1
    gauge: 18 AWG
    type: Driver signal (exact color not confirmed - see docs/opp-hardware-reference.md)
  W-HV-sling-l:
    wirecount: 1
    color: BN
    gauge: 18 AWG
    type: HV_A feed (brown, per docs/opp-hardware-reference.md)
  W-DRV-sling-l:
    wirecount: 1
    gauge: 18 AWG
    type: Driver signal (exact color not confirmed - see docs/opp-hardware-reference.md)
  W-HV-ball-saver:
    wirecount: 1
    color: BN
    gauge: 18 AWG
    type: HV_A feed (brown, per docs/opp-hardware-reference.md)
  W-DRV-ball-saver:
    wirecount: 1
    gauge: 18 AWG
    type: Driver signal (exact color not confirmed - see docs/opp-hardware-reference.md)
  W-HV-plunger:
    wirecount: 1
    color: BN
    gauge: 18 AWG
    type: HV_A feed (brown, per docs/opp-hardware-reference.md)
  W-DRV-plunger:
    wirecount: 1
    gauge: 18 AWG
    type: Driver signal (exact color not confirmed - see docs/opp-hardware-reference.md)
  W-HV-trough-eject:
    wirecount: 1
    color: BN
    gauge: 18 AWG
    type: HV_A feed (brown, per docs/opp-hardware-reference.md)
  W-DRV-trough-eject:
    wirecount: 1
    gauge: 18 AWG
    type: Driver signal (exact color not confirmed - see docs/opp-hardware-reference.md)

connections:
  # Flippers - HV_A[1,2] / DRIVER[1,2]
  -
    - HV_A: [1,2]
    - W-HV-flipper: [1,2]
    - COILS_FLIPPER: [1,3]
  -
    - DRIVER: [1,2]
    - W-DRV-flipper: [1,2]
    - COILS_FLIPPER: [2,4]
  # Right sling - HV_A[3] / DRIVER[3]
  -
    - HV_A: [3]
    - W-HV-sling-r: [1]
    - COIL_SLING_R: [1]
  -
    - DRIVER: [3]
    - W-DRV-sling-r: [1]
    - COIL_SLING_R: [2]
  # Left sling - HV_A[4] / DRIVER[4]
  -
    - HV_A: [4]
    - W-HV-sling-l: [1]
    - COIL_SLING_L: [1]
  -
    - DRIVER: [4]
    - W-DRV-sling-l: [1]
    - COIL_SLING_L: [2]
  # Ball saver - HV_A[5] / DRIVER[5]
  -
    - HV_A: [5]
    - W-HV-ball-saver: [1]
    - COIL_BALL_SAVER: [1]
  -
    - DRIVER: [5]
    - W-DRV-ball-saver: [1]
    - COIL_BALL_SAVER: [2]
  # Plunger - HV_A[6] / DRIVER[6]
  -
    - HV_A: [6]
    - W-HV-plunger: [1]
    - COIL_PLUNGER: [1]
  -
    - DRIVER: [6]
    - W-DRV-plunger: [1]
    - COIL_PLUNGER: [2]
  # Trough eject - HV_A[7] / DRIVER[7]
  -
    - HV_A: [7]
    - W-HV-trough-eject: [1]
    - COIL_TROUGH_EJECT: [1]
  -
    - DRIVER: [7]
    - W-DRV-trough-eject: [1]
    - COIL_TROUGH_EJECT: [2]
