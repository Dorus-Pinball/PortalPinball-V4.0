      - {name: s-drop2, number: 2-1-24, board: chain2-0x21, status: wired}
      - {name: s-drop3, number: 2-1-25, board: chain2-0x21, status: wired}
    coils:
      - {name: c-drop, number: 2-0-7, board: chain2-0x20, status: wired}
    checklist:
      - {item: "Flyback diode across coil", done: true}
      - {item: "Common ground tied to power supply ground", done: true}
      - {item: "Coil and its trigger switch land on the same physical OPP board",
