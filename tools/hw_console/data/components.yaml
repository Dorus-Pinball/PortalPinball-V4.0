    checklist:
      - {item: "Flyback diode across coil", done: true}
      - {item: "Common ground tied to power supply ground", done: true}
      - {item: "Coil and its trigger switch land on the same physical OPP board",
        done: true}
    notes: "Eject coil is software/event-triggered (ball_device), not a hardware autofire
      rule - the switch/coil board split (0x21 / 0x20) is fine here."

  drop-bank:
    display_name: "Drop target bank"
    status: wired
    mpf_devices: [d-drop-target1, d-drop-target2, d-drop-target3, db-dropbank]
    switches:
