    coils:
      - {name: c-sling-left, number: 0-0-0, board: chain0-0x20}
      - {name: c-sling-right, number: 0-0-12, board: chain0-0x20}
    checklist:
      - {item: "Flyback diode across coil", done: false}
      - {item: "Common ground tied to power supply ground", done: false}
      - {item: "Coil and its trigger switch land on the same physical OPP board",
        done: true}
    notes: "Moved from the PSOC red board (2-0-0/2-0-1) to the Cobra chain0-0x20 board, Bank A
      (HV_A, brown), 2026-09-13, same migration pattern as flippers/plunger/trough-eject. Numbers
      not yet physically re-wired/re-tested at the new pins - checklist reset to reflect that."

  ball-saver:
    display_name: "Ball saver post"
    status: 4
    mpf_devices: []
    switches:
