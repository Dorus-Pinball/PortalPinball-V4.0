  flippers:
    display_name: "Flippers"
    status: planned
    mpf_devices: [left_flipper, right_flipper]
    switches:
      - {name: s-left-flipper, number: 2-1-0, board: chain2-0x21, status: planned}
      - {name: s-right-flipper, number: 2-1-1, board: chain2-0x21, status: planned}
    coils:
