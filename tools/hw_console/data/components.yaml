    display_name: "Chain 0 / Board 0x20 (Cobra LED driver)"
    port: COM4
    chain: 0
    address: "0x20"
    firmware: "0x2040000"
    role: led-driver
    status: scanned
    notes: "Also has 16 unused solenoid outputs (see commented Cobra 0-0-x placeholders
      in hardware-coils.yaml)."
