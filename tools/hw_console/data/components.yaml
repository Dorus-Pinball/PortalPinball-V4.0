# Hardware bring-up registry for Portal Pinball V4.0.
#
# This is a tracking layer, NOT MPF config - the real switch/coil numbers MPF loads live in
# machinefolder/config/hardware-switches.yaml and hardware-coils.yaml, unchanged by this file.
# Edit this by hand or through the hw_console web UI (see tools/hw_console/README.md).
#
# Seeded 2026-08-30 from the state of hardware-*.yaml / hardware-devices.yaml / TODO.md /
# plans/resumption-roadmap.md at that time: components without a DRAFT marker in those files are
# seeded as `wired` (the machine logged 23 real games in Sept-Oct 2024 per the roadmap); the
# DRAFT-marked components (flippers, ramp-diverter/subway, service-mode nav) are seeded as
# `planned`. Board status is seeded as `scanned` (the last known state, from the hardware-scan
# comment block in hardware-basic.yaml) since the machine has been dormant ~22 months and boards
# are being reconnected/reverified now, not assumed still connected.

checklist_template:
  - {item: "Flyback diode across coil", done: false}
  - {item: "Common ground tied to power supply ground", done: false}
  - {item: "Coil and its trigger switch land on the same physical OPP board", done: false}

boards:
  chain0-0x20:
    display_name: "Chain 0 / Board 0x20 (Cobra LED driver)"
    port: COM4
    chain: 0
    address: "0x20"
    firmware: "0x2040000"
    role: led-driver
    status: scanned
    notes: "Also has 16 unused solenoid outputs (see commented Cobra 0-0-x placeholders
      in hardware-coils.yaml)."
  chain1-0x20:
    display_name: "Chain 1 / Board 0x20 (Cobra LED driver)"
    port: COM5
    chain: 1
    address: "0x20"
    firmware: "0x2040000"
    role: led-driver
    status: scanned
    notes: "Also has 8 unused solenoid outputs (see commented Cobra 1-0-x placeholders
      in hardware-coils.yaml)."
  chain2-0x20:
    display_name: "Chain 2 / Board 0x20 (PSOC card 0)"
    port: COM6
    chain: 2
    address: "0x20"
    firmware: "0x1000004"
    role: psoc-switches-coils
    status: scanned
  chain2-0x21:
    display_name: "Chain 2 / Board 0x21 (PSOC card 1)"
    port: COM6
    chain: 2
    address: "0x21"
    firmware: "0x1000004"
    role: psoc-switches-coils
    status: scanned
  chain2-0x22:
    display_name: "Chain 2 / Board 0x22 (PSOC card 2, incl. incandescent card)"
    port: COM6
    chain: 2
    address: "0x22"
    firmware: "0x1000004"
    role: psoc-switches-coils-incand
    status: scanned
  chain2-0x23:
    display_name: "Chain 2 / Board 0x23 (PSOC card 3)"
    port: COM6
    chain: 2
    address: "0x23"
    firmware: "0x1000004"
    role: psoc-switches-coils
    status: scanned

components:
  autofire-slings:
    display_name: "Slings (autofire)"
    status: wired
    mpf_devices: [ac-sling-left, ac-sling-right]
    switches:
      - {name: s-left-sling, number: 2-0-1, board: chain2-0x20, status: wired}
      - {name: s-right-sling, number: 2-0-0, board: chain2-0x20, status: wired}
    coils:
      - {name: c-sling-left, number: 2-0-1, board: chain2-0x20, status: wired}
      - {name: c-sling-right, number: 2-0-0, board: chain2-0x20, status: wired}
    checklist:
      - {item: "Flyback diode across coil", done: true}
      - {item: "Common ground tied to power supply ground", done: true}
      - {item: "Coil and its trigger switch land on the same physical OPP board",
        done: true}
    notes: ""

  autofire-popbumpers:
    display_name: "Pop bumpers (autofire)"
    status: wired
    mpf_devices: [ac-popbumper-1, ac-popbumper-2, ac-popbumper-3]
    switches:
      - {name: s-popbumper-1, number: 2-0-8, board: chain2-0x20, status: wired}
      - {name: s-popbumper-2, number: 2-0-9, board: chain2-0x20, status: wired}
      - {name: s-popbumper-3, number: 2-0-10, board: chain2-0x20, status: wired}
    coils:
      - {name: c-popbumper-1, number: 2-0-4, board: chain2-0x20, status: wired}
      - {name: c-popbumper-2, number: 2-0-5, board: chain2-0x20, status: wired}
      - {name: c-popbumper-3, number: 2-0-6, board: chain2-0x20, status: wired}
    checklist:
      - {item: "Flyback diode across coil", done: true}
      - {item: "Common ground tied to power supply ground", done: true}
      - {item: "Coil and its trigger switch land on the same physical OPP board",
        done: true}
    notes: ""

  plunger-launch:
    display_name: "Plunger lane / auto-launch"
    status: wired
    mpf_devices: [bd-plunger]
    switches:
