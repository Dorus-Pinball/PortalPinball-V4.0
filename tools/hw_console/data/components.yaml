    notes: "s-start/s-launch are cabinet buttons, not playfield switches."

  trough:
    display_name: "Ball trough"
    status: wired
    mpf_devices: [bd-trough]
    switches:
      - {name: s-trough1, number: 2-1-16, board: chain2-0x21, status: wired}
      - {name: s-trough2, number: 2-1-17, board: chain2-0x21, status: wired}
      - {name: s-trough3, number: 2-1-18, board: chain2-0x21, status: wired}
      - {name: s-trough4, number: 2-1-19, board: chain2-0x21, status: wired}
      - {name: s-trough5, number: 2-1-20, board: chain2-0x21, status: wired}
      - {name: s-trough6, number: 2-1-21, board: chain2-0x21, status: wired}
      - {name: s-trough-jam, number: 2-1-22, board: chain2-0x21, status: wired}
    coils:
