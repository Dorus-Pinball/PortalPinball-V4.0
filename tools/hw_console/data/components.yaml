# Hardware bring-up registry for Portal Pinball V4.0.
#
# This is a tracking layer, NOT MPF config - the real switch/coil numbers MPF loads live in
# machinefolder/config/hardware-switches.yaml and hardware-coils.yaml, unchanged by this file.
# Edit this by hand or through the hw_console web UI (see tools/hw_console/README.md).
#
# Each component's `status` is a 1-6 build-lifecycle stage (see registry.COMPONENT_STATUSES):
#   1 - Idea - no hardware yet
#   2 - Hardware - no idea yet (not renovated: old stickers, rough cables, etc.)
#   3 - Hardware with a purpose - not renovated
#   4 - Renovated hardware with a purpose - not wired to the playfield & controllers
#   5 - Fully connected (on playfield) - not tested
#   6 - Ready - fully connected & tested
# Switch/coil pin entries (name/number/board) are read-only display here - they only change via
# the wire-component skill editing this file directly, never through the hw_console UI.
#
# Seeded 2026-09-06 by migrating the original 2026-08-30 planned/wired/tested seed onto this
# scale: components that were `wired` (no DRAFT marker; the machine logged 23 real games in
# Sept-Oct 2024 per the roadmap) start at 6. Components that were `planned` (flippers,
# ramp-diverter-subway, service-mode-nav - all DRAFT-marked) start at 4, since they already have
# real (if unconfirmed) pin numbers picked, just not physically wired/verified yet. These
# starting values are a reasonable default, not a precise audit - walk through and correct each
# one via the Status tab as the actual state becomes clearer.
# Board status is seeded as `scanned` (the last known state, from the hardware-scan comment block
# in hardware-basic.yaml) since the machine has been dormant ~22 months and boards are being
# reconnected/reverified now, not assumed still connected.

checklist_template:
  - {item: "Flyback diode across coil", done: false}
  - {item: "Common ground tied to power supply ground", done: false}
  - {item: "Coil and its trigger switch land on the same physical OPP board", done: false}

boards:
  chain0-0x20:
    display_name: "Chain 0 / Board 0x20 (Cobra LED driver)"
    port: COM4
    chain: 0
    address: "0x20"
    firmware: "0x2040000"
    role: led-driver
    status: scanned
    notes: "Also has 16 unused solenoid outputs (see commented Cobra 0-0-x placeholders
      in hardware-coils.yaml)."
  chain1-0x20:
    display_name: "Chain 1 / Board 0x20 (Cobra LED driver)"
    port: COM5
    chain: 1
    address: "0x20"
    firmware: "0x2040000"
    role: led-driver
    status: scanned
    notes: "Also has 8 unused solenoid outputs (see commented Cobra 1-0-x placeholders
      in hardware-coils.yaml)."
  chain2-0x20:
    display_name: "Chain 2 / Board 0x20 (PSOC card 0)"
    port: COM6
    chain: 2
    address: "0x20"
    firmware: "0x1000004"
    role: psoc-switches-coils
    status: scanned
  chain2-0x21:
    display_name: "Chain 2 / Board 0x21 (PSOC card 1)"
    port: COM6
    chain: 2
    address: "0x21"
    firmware: "0x1000004"
    role: psoc-switches-coils
    status: scanned
  chain2-0x22:
    display_name: "Chain 2 / Board 0x22 (PSOC card 2, incl. incandescent card)"
    port: COM6
    chain: 2
    address: "0x22"
    firmware: "0x1000004"
    role: psoc-switches-coils-incand
    status: scanned
  chain2-0x23:
    display_name: "Chain 2 / Board 0x23 (PSOC card 3)"
    port: COM6
    chain: 2
    address: "0x23"
    firmware: "0x1000004"
    role: psoc-switches-coils
    status: scanned

