      - {name: c-flipper-right, number: 2-1-1, board: chain2-0x21, status: planned}
    checklist:
      - done: false
        item: Flyback diode across coil
      - done: false
        item: Common ground tied to power supply ground
      - done: false
        item: Coil and its trigger switch land on the same physical OPP board
    notes: "Mechanical EOS inside coil assembly, not wired back to controller - main_coil
      only, no hold_coil/eos_switch. Numbers are DRAFT pending a physical continuity
      check against board Overviews.xlsx (see TODO.md)."

  ramp-diverter-subway:
