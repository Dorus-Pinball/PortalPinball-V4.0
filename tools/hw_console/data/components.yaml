      - {item: "Coil and its trigger switch land on the same physical OPP board",
        done: false}
    notes: "Names must stay exactly sw_service_enter/esc/up/down - MPF 0.80.0's service
      mode hardcodes these literal switch names, ignoring any mode_settings override
      (see hardware-switches.yaml's comment). No coils. Numbers are DRAFT."
