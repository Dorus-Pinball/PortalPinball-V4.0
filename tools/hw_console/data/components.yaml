    notes: "New 2026-09-13. Coil takes a short pulse (no hold power) to kick the post between its
      two positions; switch senses which position (up/down) it's currently in - not a
      hardware-autofire pair, coil is software/event-triggered. Cobra chain0-0x20, Bank A
      (HV_A, brown). No game logic/mode wiring yet (no autofire_coils or other device entry in
      hardware-devices.yaml) - what triggers the pulse and what up/down mean gameplay-wise is
