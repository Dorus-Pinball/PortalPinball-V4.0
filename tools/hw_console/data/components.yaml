      (bd-vukmid/bd-vuktop are commented out in hardware-devices.yaml with no eject_coil
      assigned) - a ball reaching either VUK currently has no way to be ejected."

  portal-transfer:
    display_name: "Portal ball transfer (dropper -> portal -> exit)"
    status: wired
    mpf_devices: []
    switches:
      - {name: s-dropper, number: 2-1-30, board: chain2-0x21, status: wired}
