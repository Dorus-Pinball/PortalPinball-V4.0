name: CI

# Runs the test suite, the hardware-registry collision/pairing check, and a doc-freshness check
# on every push and PR. The doc-freshness check is the mechanical backstop for the exact failure
# this project's KM overhaul exists to eliminate: design/physical-checklists/wiring-guide.html,
# docs/wiring-guide.md, and docs/references/index.md are generated files (see
# tools/hw_console/generate_docs.py) - this job re-runs the generator and fails the build if
# the committed output doesn't match, catching drift regardless of how it happened (a manual edit,
# a tool other than Claude Code, a forgotten re-run before committing).

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # WireViz (used by generate_docs.py to render tools/hw_console/data/harnesses/*.yaml)
      # shells out to Graphviz's `dot` binary - not a Python package, install separately. Without
      # this the doc-freshness step below fails with a WireViz/Graphviz error, not a silent skip
      # - see generate_docs.py's own failure-mode docstring for why that's deliberate.
      - name: Install Graphviz
        run: sudo apt-get update && sudo apt-get install -y graphviz

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mpf==0.80.0 jsonschema==4.26.0 jinja2==3.1.6 "ruamel.yaml==0.18.6" wireviz==0.4.1

      - name: Run test suite
        run: python -m unittest discover tests

      - name: Check hardware registry (collisions / pairing rules)
        run: python tools/hw_console/check_registry.py

      - name: Check generated docs are up to date
        run: |
          cp design/physical-checklists/wiring-guide.html /tmp/wiring-guide-before.html
          cp docs/wiring-guide.md /tmp/wiring-guide-md-before.md
          cp docs/references/index.md /tmp/references-index-before.md
          python tools/hw_console/generate_docs.py

          # WireViz's embedded SVG isn't byte-reproducible across Graphviz/font environments -
          # confirmed two real, otherwise-clean CI failures: (1) text-layout coordinates shift
          # with installed fonts (this runner's font substitution vs. a local Windows/Arial
          # environment), and (2) this runner's apt-installed Graphviz (2.43.0, from 2019) vs. a
          # locally-installed 12.2.1 stamps a different "Generated by graphviz version ..."
          # comment right before the <svg> tag. Strip from that comment through </svg> - present
          # only on Graphviz's own output, not the static hand-drawn switch-wing sketch elsewhere
          # in this file, so this correctly targets just the WireViz-rendered block. This check
          # then verifies the DATA-DRIVEN content (the tables generated from components.yaml)
          # without false-failing on rendering-environment differences. A WireViz render failure
          # is still caught above - generate_docs.py exits non-zero on that regardless of this
          # diff.
          strip_svg() { sed '/<!-- Generated by graphviz/,/<\/svg>/d' "$1"; }

          # generate_docs.py also stamps every output with today's date (datetime.date.today()) as
          # a "last regenerated" marker - confirmed a third real, otherwise-clean CI failure: a day
          # boundary passing between when the docs were last committed and when this job runs (or
          # between two CI runs on different days) changes that stamp with zero underlying data
          # drift. Normalize only the three known "generated on" stamps to a fixed placeholder
          # before diffing, anchored to their exact surrounding label text so a REAL per-row date
          # (e.g. references/index.md's "Archived" column, sourced from docs/references/index.yaml)
          # is never masked - only the top-of-file "generated at" timestamp itself.
          normalize_date() {
            sed -E \
              -e 's/(Date <span class="blank">)[0-9]{4}-[0-9]{2}-[0-9]{2}(<\/span>)/\1DATE\2/' \
              -e 's/(Generated )[0-9]{4}-[0-9]{2}-[0-9]{2}( by <span)/\1DATE\2/' \
              -e 's/^(Generated: )[0-9]{4}-[0-9]{2}-[0-9]{2}(\.)$/\1DATE\2/'
          }

          diff <(strip_svg /tmp/wiring-guide-before.html | normalize_date) \
               <(strip_svg design/physical-checklists/wiring-guide.html | normalize_date)
          # docs/wiring-guide.md references its harness diagrams as separate files
          # (docs/wiring-diagrams/*.svg) rather than embedding them inline, so there's no SVG
          # noise to strip here - the whole file is DATA-DRIVEN text and gets a normal diff. The
          # SVG files themselves are intentionally not freshness-checked at all, same reasoning
          # as the strip_svg exemption above (WireViz/Graphviz output isn't byte-reproducible
          # across environments) - a render failure there still fails the generate_docs.py step
          # itself, this just doesn't additionally diff the pixels.
          diff <(normalize_date < /tmp/wiring-guide-md-before.md) \
               <(normalize_date < docs/wiring-guide.md)
          diff <(normalize_date < /tmp/references-index-before.md) \
               <(normalize_date < docs/references/index.md)
